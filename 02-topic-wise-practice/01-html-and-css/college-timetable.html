<!DOCTYPE html>
<html>
<head>
    <title>College Timetable</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        table {
            width: 80%;
            margin: 30px auto;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 12px;
        }

        th {
            background-color: lightblue;
        }

        td:hover {
            background-color: lightyellow;
        }
    </style>
</head>

<body>

    <h1>College Timetable</h1>

    <table>

        <tr>
            <th>Day</th>
            <th>9 - 10</th>
            <th>10 - 11</th>
            <th>11 - 12</th>
            <th>1 - 2</th>
        </tr>

        <tr>
            <td>Monday</td>
            <td>FS</td>
            <td>DAA</td>
            <td>ML</td>
            <td rowspan="2">FS Lab</td>
        </tr>

        <tr>
            <td>Tuesday</td>
            <td>OS</td>
            <td>FS</td>
            <td>DAA</td>
        </tr>

        <tr>
            <td>Wednesday</td>
            <td>ML</td>
            <td colspan="2">Web Lab</td>
            <td>OS</td>
        </tr>

        <tr>
            <td>Thursday</td>
            <td>DAA</td>
            <td>ML</td>
            <td>FS</td>
            <td>OS</td>
        </tr>

    </table>

</body>
</html>
