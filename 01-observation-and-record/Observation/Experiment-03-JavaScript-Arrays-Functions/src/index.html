<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marks Analyzer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Marks Analyzer</h1>

        <p>Enter marks for five subjects:</p>

        <div class="inputs">
            <input type="number" id="mark1" placeholder="Subject 1" min="0" max="100">
            <input type="number" id="mark2" placeholder="Subject 2" min="0" max="100">
            <input type="number" id="mark3" placeholder="Subject 3" min="0" max="100">
            <input type="number" id="mark4" placeholder="Subject 4" min="0" max="100">
            <input type="number" id="mark5" placeholder="Subject 5" min="0" max="100">
        </div>

        <button id="analyzeBtn">Analyze Marks</button>

        <div id="result"></div>

    </div>

    <script src="app.js"></script>

</body>
</html>
